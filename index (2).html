<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to PDF Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{--bg1:#eef2ff;--bg2:#e0f2fe;--panel:#fff;--primary:#4f46e5;--primary-dark:#4338ca;--text:#1f2937;--muted:#6b7280;--border:#dbe3f0;--danger:#dc2626;--success:#059669;--warning:#f59e0b;--shadow:rgba(15,23,42,.12)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;color:var(--text)}
    .app{width:min(900px,100%);background:var(--panel);border-radius:20px;box-shadow:0 14px 38px var(--shadow);overflow:hidden}
    .header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:22px 26px}
    .header h1{margin:0;font-size:clamp(1.6rem,2vw,2.2rem)}
    .content{padding:24px 26px 30px}
    .controls{display:grid;grid-template-columns:1fr 180px 180px;gap:16px;margin-bottom:18px;align-items:end}
    .field{display:flex;flex-direction:column;gap:8px}
    label{font-size:.9rem;font-weight:600}
    input[type="file"]{width:100%;padding:14px 12px;border-radius:12px;border:2px dashed #a5b4fc;background:#f8faff;color:var(--text);cursor:pointer}
    select{width:100%;padding:12px 10px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:.95rem;color:var(--text)}
    .upload-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{border:none;border-radius:12px;padding:12px 18px;font-size:.98rem;cursor:pointer;transition:.2s ease}
    .primary-btn{background:var(--primary);color:#fff;min-width:180px}
    .primary-btn:hover{background:var(--primary-dark)}
    .secondary-btn{background:#eef2ff;color:var(--text);border:1px solid var(--border)}
    .secondary-btn:hover{background:#e6ebff}
    .notice{background:#f3f4f6;border:1px solid var(--border);border-left:4px solid var(--warning);border-radius:12px;padding:12px 14px;font-size:.92rem;line-height:1.5;margin-bottom:18px}
    .preview-wrap{margin-top:20px}
    .preview-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    .preview-header h2{margin:0;font-size:1.1rem}
    .preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;min-height:80px}
    .thumb{border:1px solid var(--border);border-radius:12px;background:#fafafa;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:grab;user-select:none}
    .thumb:active{cursor:grabbing}
    .thumb img{width:100%;height:120px;object-fit:cover;display:block;background:#f3f4f6}
    .thumb-meta{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:8px 10px;border-top:1px solid var(--border);background:#fff}
    .thumb-name{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
    .move{background:#eef2ff;border:1px solid var(--border);color:var(--text);border-radius:8px;width:32px;height:32px;padding:0;font-size:1rem;line-height:1}
    .move:disabled{opacity:.35;cursor:default}
    .remove{background:transparent;border:none;color:var(--danger);font-weight:700;cursor:pointer;font-size:1.2rem;padding:0 4px;line-height:1}
    .status{margin-top:18px;min-height:22px;font-size:.95rem;color:var(--muted);text-align:center;word-break:break-word}
    .status.success{color:var(--success);font-weight:600}
    .status.error{color:var(--danger);font-weight:600}
    .empty-state{border:1px dashed var(--border);border-radius:12px;background:#fafbfd;padding:22px;text-align:center;color:var(--muted);font-size:.95rem}
    @media (max-width:700px){.controls{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <div class="header"><h1>Image to PDF Converter</h1></div>
    <div class="content">
      <div class="notice">
        <strong>Privacy:</strong> All image conversion happens locally in your browser. No files are uploaded or stored on a server. The images stay in browser memory only while the page is open.
      </div>
      <div class="controls">
        <div class="field">
          <label for="imageInput">Select images</label>
          <input id="imageInput" type="file" accept=".jpg,.jpeg,.png,.webp,.heic,.heif,image/jpeg,image/png,image/webp,image/heic,image/heif" multiple />
        </div>
        <div class="field">
          <label for="pageSize">Page size</label>
          <select id="pageSize"><option value="a4">A4</option><option value="letter">US Letter</option></select>
        </div>
        <div class="field">
          <label for="orientation">Orientation</label>
          <select id="orientation"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select>
        </div>
      </div>
      <div class="upload-row">
        <button class="primary-btn" id="convertBtn" type="button">Convert to PDF</button>
        <button class="secondary-btn" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="preview-wrap">
        <div class="preview-header"><h2>Thumbnail order</h2></div>
        <div id="preview" class="preview"></div>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const statusBox = document.getElementById("status");
    const convertBtn = document.getElementById("convertBtn");
    const clearBtn = document.getElementById("clearBtn");
    const pageSizeSelect = document.getElementById("pageSize");
    const orientationSelect = document.getElementById("orientation");

    let selectedImages = [];
    let draggedIndex = null;

    function updateStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status";
      if (type) statusBox.classList.add(type);
    }

    function isSupportedFile(file) {
      const allowedTypes = ["image/jpeg", "image/png", "image/webp", "image/heic", "image/heif"];
      const name = (file.name || "").toLowerCase();
      if (allowedTypes.includes((file.type || "").toLowerCase())) return true;
      return [".jpg", ".jpeg", ".png", ".webp", ".heic", ".heif"].some((ext) => name.endsWith(ext));
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function loadImageFromSource(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Image could not be loaded."));
        img.src = src;
      });
    }

    // FIX: files are now added one at a time, so they keep the order you picked.
    async function addFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;

      let added = 0;
      const problems = [];

      for (const file of files) {
        if (!isSupportedFile(file)) {
          problems.push('"' + file.name + '" is not a supported image type.');
          continue;
        }
        try {
          const src = await fileToDataUrl(file);
          await loadImageFromSource(src);
          selectedImages.push({ file, src });
          added++;
        } catch (err) {
          problems.push('"' + file.name + '" could not be opened by this browser. HEIC photos only work in Safari.');
        }
      }

      renderThumbnails();

      if (problems.length) {
        updateStatus((added ? added + " image(s) added. " : "") + problems.join(" "), "error");
      } else {
        updateStatus(added + " image(s) added. Use the arrows or drag to reorder.", "success");
      }
    }

    // FIX: arrow buttons so reordering also works on phones.
    function moveImage(from, to) {
      if (to < 0 || to >= selectedImages.length) return;
      const [item] = selectedImages.splice(from, 1);
      selectedImages.splice(to, 0, item);
      renderThumbnails();
    }

    function renderThumbnails() {
      if (!selectedImages.length) {
        preview.innerHTML = '<div class="empty-state">No images selected yet. Add JPG, PNG, WEBP, or HEIC files.</div>';
        return;
      }

      preview.innerHTML = "";

      selectedImages.forEach((item, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "thumb";
        wrapper.draggable = true;

        wrapper.addEventListener("dragstart", (e) => {
          draggedIndex = index;
          e.dataTransfer.effectAllowed = "move";
        });
        wrapper.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
        });
        wrapper.addEventListener("drop", (e) => {
          e.preventDefault();
          if (draggedIndex === null || draggedIndex === index) return;
          moveImage(draggedIndex, index);
          draggedIndex = null;
        });

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.file.name;

        const meta = document.createElement("div");
        meta.className = "thumb-meta";

        const name = document.createElement("div");
        name.className = "thumb-name";
        name.textContent = (index + 1) + ". " + item.file.name;

        const up = document.createElement("button");
        up.className = "move";
        up.type = "button";
        up.textContent = "\u2191";
        up.title = "Move earlier";
        up.setAttribute("aria-label", "Move earlier");
        up.disabled = index === 0;
        up.addEventListener("click", () => moveImage(index, index - 1));

        const down = document.createElement("button");
        down.className = "move";
        down.type = "button";
        down.textContent = "\u2193";
        down.title = "Move later";
        down.setAttribute("aria-label", "Move later");
        down.disabled = index === selectedImages.length - 1;
        down.addEventListener("click", () => moveImage(index, index + 1));

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove";
        removeBtn.type = "button";
        removeBtn.textContent = "\u00d7";
        removeBtn.title = "Remove image";
        removeBtn.setAttribute("aria-label", "Remove image");
        removeBtn.addEventListener("click", () => {
          selectedImages.splice(index, 1);
          renderThumbnails();
          updateStatus("Image removed.", "success");
        });

        meta.append(name, up, down, removeBtn);
        wrapper.append(img, meta);
        preview.appendChild(wrapper);
      });
    }

    function getPdfConfig() {
      return {
        orientation: orientationSelect.value === "landscape" ? "landscape" : "portrait",
        format: pageSizeSelect.value === "letter" ? "letter" : "a4"
      };
    }

    function base64ToCanvasDataUrl(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.width;
          canvas.height = img.height;
          canvas.getContext("2d").drawImage(img, 0, 0);
          resolve(canvas.toDataURL("image/png"));
        };
        img.onerror = reject;
        img.src = src;
      });
    }

    async function generatePdf() {
      if (!selectedImages.length) {
        updateStatus("Please add at least one image.", "error");
        return;
      }

      // FIX: this is the correct way to get jsPDF from the library file we load.
      const JsPDF = window.jspdf ? window.jspdf.jsPDF : window.jsPDF;
      if (!JsPDF) {
        updateStatus("The PDF tool could not load. Check your internet connection and reload the page.", "error");
        return;
      }

      updateStatus("Generating PDF...", "");

      try {
        const { orientation, format } = getPdfConfig();
        const pdf = new JsPDF({ orientation, unit: "mm", format });

        for (let i = 0; i < selectedImages.length; i++) {
          const convertedSrc = await base64ToCanvasDataUrl(selectedImages[i].src);
          const img = await loadImageFromSource(convertedSrc);

          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const ratio = Math.min(pageWidth / img.width, pageHeight / img.height);
          const imgWidth = img.width * ratio;
          const imgHeight = img.height * ratio;
          const x = (pageWidth - imgWidth) / 2;
          const y = (pageHeight - imgHeight) / 2;

          if (i > 0) pdf.addPage();
          pdf.addImage(convertedSrc, "PNG", x, y, imgWidth, imgHeight, undefined, "FAST");
        }

        pdf.save("converted-images.pdf");
        updateStatus("PDF generated successfully.", "success");
      } catch (error) {
        console.error(error);
        updateStatus("Unable to generate PDF. Try removing the last image you added and convert again.", "error");
      }
    }

    function clearImages() {
      selectedImages = [];
      fileInput.value = "";
      renderThumbnails();
      updateStatus("Selection cleared.", "success");
    }

    fileInput.addEventListener("change", (event) => {
      addFiles(event.target.files).then(() => { fileInput.value = ""; });
    });
    convertBtn.addEventListener("click", generatePdf);
    clearBtn.addEventListener("click", clearImages);

    renderThumbnails();
  </script>
</body>
</html>
